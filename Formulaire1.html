<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script>
        p {
  color: gray;
}

    .publication .message {
  color: blue;
}

#actualites p {
  color: green;
}

#actualites .publication > p.message {
  color: red;
}

.details p.message {
  color: orange;
}

    </script>
</head>
<body>
    
    <section id="actualites">
  <article class="publication">
    <h2>Journée portes ouvertes</h2>

    <p class="message">Entrée gratuite</p>

    <div class="details">
      <p class="message">Accueil à partir de 9 h</p>
    </div>

    <p>Inscription obligatoire</p>
  </article>
</section>



</body>
</html>
