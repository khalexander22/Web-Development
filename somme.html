<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="nb1" >Nombre 1 : </label>
    <input type="number" id="nb1"><br><br>
    <label for="nb2">Nombre 2 : </label>
    <input type="number" id="nb2"><br><br>
    <button onclick="calculerSomme()" >Calculer</button>
    <input type="number" id="result" disabled> 

    <script>
        function calculerSomme(){
        const nombre1=Number(document.getElementById("nb1").value);
        const nombre2=Number(document.getElementById("nb2").value);
        const result=document.getElementById("result");
        let somme=nombre1+nombre2;
        result.value=somme;
        }
    </script>
</body>
</html>
